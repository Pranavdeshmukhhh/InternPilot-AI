name: Secret history guard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checksum-pinned scanner
        run: python scripts/install-gitleaks.py "$RUNNER_TEMP/gitleaks"
      - name: Reject tracked private runtime paths
        run: python scripts/check-release-hygiene.py
      - name: Scan reachable history with redacted output
        run: python scripts/scan-secrets.py --binary "$RUNNER_TEMP/gitleaks/gitleaks" --report artifacts/secret-scan-summary.json
