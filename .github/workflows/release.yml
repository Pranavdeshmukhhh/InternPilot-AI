name: Release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t internpilot-backend:release backend
      - run: docker build -t internpilot-frontend:release frontend
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/release.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-release-candidate
          path: dist/InternPilot-AI-release.zip
# Deliberately no automatic deployment/push: review the release report, license,
# external-action policy and target environment before promoting these images.
