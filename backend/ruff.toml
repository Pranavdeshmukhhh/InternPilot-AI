"tests/test_account_security.py" = ["F811"]
"tests/test_hosting.py" = ["F811"]
"tests/test_notification_delivery.py" = ["F811"]
"tests/test_reminders_monitoring.py" = ["F811"]
"tests/test_platform_upgrade.py" = ["F811"]
